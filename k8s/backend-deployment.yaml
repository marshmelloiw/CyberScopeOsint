apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberscope-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberscope-backend
  template:
    metadata:
      labels:
        app: cyberscope-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yourorg/cyberscope-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/osint_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
            - name: REPORT_SERVICE_URL
              value: http://report-service:8010
---
apiVersion: v1
kind: Service
metadata:
  name: cyberscope-backend
spec:
  type: ClusterIP
  selector:
    app: cyberscope-backend
  ports:
    - port: 8080
      targetPort: 8080
