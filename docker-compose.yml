version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberscope}
      POSTGRES_USER: ${POSTGRES_USER:-cyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberpass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cyberscope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cyber}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cyberpass}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:


