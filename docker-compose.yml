services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cyberscope-postgres
    environment:
      POSTGRES_DB: cyberscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberscope-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberscope-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberscope
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_PROFILES_ACTIVE: dev
      # API Keys - set these via .env file or environment variables
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-Vg3Cqg9KxB32E0ZhT1JRraMiYLeBAjdf}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-5f8038cb6237695af7d6b01f508fff4d1512782710d924ac6df87b07ffe2219b}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyAmRJO5umgeEyRzgjayTT7LX3Ywn5y4qPM}
      ZAP_API_KEY: ${ZAP_API_KEY:-1ucgq9qu0b6tdgcl4914if6icc}
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://localhost:9091}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-b20c60b956f0daf982ef48bfc19f1fa2}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberscope-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: cyberscope-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cyberscope-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cyberscope-network:
    driver: bridge

