server:
  port: 8080
  address: 0.0.0.0  # Allow connections from all network interfaces (including Android emulator)

spring:
  application:
    name: osint-backend
  
  profiles:
    active: dev
  
  config:
    import: optional:file:.env
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberscope}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true  # Enable Flyway to create scan tables
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    baseline-version: 1  # Start from V1 since V1 is just a placeholder
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}

# OSINT API Keys Configuration
osint:
  twitter:
    api-key: ${TWITTER_API_KEY:}
    api-secret: ${TWITTER_API_SECRET:}
    bearer-token: ${TWITTER_BEARER_TOKEN:}
  shodan:
    api-key: ${SHODAN_API_KEY:}
  virustotal:
    api-key: ${VIRUSTOTAL_API_KEY:}
  hibp:
    api-key: ${HIBP_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  zap:
    api-key: ${ZAP_API_KEY:}
    base-url: ${ZAP_BASE_URL:http://localhost:9091}
    auto-start: ${ZAP_AUTO_START:false}
    daemon-command: ${ZAP_DAEMON_COMMAND:}
    daemon-working-directory: ${ZAP_DAEMON_WORKING_DIR:}
    startup-timeout-seconds: ${ZAP_STARTUP_TIMEOUT_SECONDS:120}
    max-body-size-bytes: ${ZAP_MAX_BODY_SIZE_BYTES:4194304}
logging:
  level:
    osint: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:b20c60b956f0daf982ef48bfc19f1fa2}
    expiration: ${SECURITY_JWT_EXPIRATION:3600}
    refresh-expiration: ${SECURITY_JWT_REFRESH_EXPIRATION:604800}

