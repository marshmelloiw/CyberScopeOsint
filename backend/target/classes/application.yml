server:
  port: 8080

spring:
  application:
    name: osint-backend
  
  profiles:
    active: dev
  
  config:
    import: optional:file:.env
  
  datasource:
    url: jdbc:postgresql://localhost:5432/osint_db
    driver-class-name: org.postgresql.Driver
    username: osint_user
    password: osint_password
  
  jpa:
    hibernate:
      ddl-auto: none  # Flyway kullanıyoruz, DB yapısı zaten mevcut
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# OSINT API Keys Configuration
osint:
  shodan:
    api-key: ${SHODAN_API_KEY:Vg3Cqg9KxB32E0ZhT1JRraMiYLeBAjdf}
  virustotal:
    api-key: ${VIRUSTOTAL_API_KEY:5f8038cb6237695af7d6b01f508fff4d1512782710d924ac6df87b07ffe2219b}
  hibp:
    api-key: ${HIBP_API_KEY:your_actual_hibp_api_key_here}
  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyCE7kdwhNHHY0htwf_BHIoQ53LLs8WExH4}

logging:
  level:
    osint: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

