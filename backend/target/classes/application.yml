server:
  port: 8080

spring:
  application:
    name: osint-backend
  
  profiles:
    active: dev
  
  config:
    import: optional:file:.env
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberscope local}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:cyber}
    password: ${SPRING_DATASOURCE_PASSWORD:cyberpass}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true  # Enable Flyway to create scan tables
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    baseline-version: 1  # Start from V1 since V1 is just a placeholder
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}

